name: panel-test

# Started by hand. Asks the hosting panel's file interface, on the port that
# GitHub can reach, to list the two site folders. It changes nothing there.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PANEL: https://${{ secrets.FTP_HOST }}:2222
      PANEL_USERNAME: ${{ secrets.FTP_USERNAME }}
      PANEL_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: List the two folders through the panel
        run: |
          # The password goes to curl in a file, not on the command line.
          umask 077
          printf 'user = "%s:%s"\n' "$PANEL_USERNAME" "$PANEL_PASSWORD" > "$RUNNER_TEMP/auth"
          for folder in /domains/damjanko.com/public_html /domains/damjanko.si/public_html; do
            echo "== $folder"
            status=$(curl --silent --show-error --max-time 30 --config "$RUNNER_TEMP/auth" \
              --output "$RUNNER_TEMP/answer" --write-out '%{http_code} %{content_type}' \
              --get --data-urlencode "path=$folder" --data "json=yes" \
              "$PANEL/CMD_API_FILE_MANAGER")
            echo "HTTP $status"
            # Names only; an error page is shown as its first 300 characters.
            python3 - "$RUNNER_TEMP/answer" "$folder" <<'PY'
          import json, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          try:
              data = json.loads(text)
          except ValueError:
              print('Not JSON:', ' '.join(text.split())[:300])
              sys.exit(1)
          names = sorted(key[len(sys.argv[2]) + 1:] for key in data if key.startswith(sys.argv[2] + '/'))
          print(len(names), 'entries:', ', '.join(names) if names else json.dumps(data)[:300])
          PY
          done
          rm --force "$RUNNER_TEMP/auth" "$RUNNER_TEMP/answer"
