name: ftp-test

# Started by hand. Connects to the host as the release does and lists the two
# folders, without changing anything there. For finding out why an upload fails.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FOLDER_COM: ${{ vars.FTP_FOLDER_COM || 'domains/damjanko.com/public_html' }}
      FOLDER_SI: ${{ vars.FTP_FOLDER_SI || 'domains/damjanko.si/public_html' }}
    steps:
      - name: What the host name looks like
        run: |
          # Says what kind of value the secret holds without showing it.
          case "$FTP_HOST" in
            *://*) echo "::error::FTP_HOST contains a scheme such as https://. It must be the bare host name." ;;
            *:*) echo "::error::FTP_HOST contains a port. It must be the bare host name." ;;
            */*) echo "::error::FTP_HOST contains a slash. It must be the bare host name." ;;
            *" "*) echo "::error::FTP_HOST contains a space." ;;
            *) echo "FTP_HOST looks like a bare host name." ;;
          esac
          echo "This runner's address: $(curl --silent --max-time 10 https://api.ipify.org || echo unknown)"

      - name: Which ports can be reached
        run: |
          # 21 FTP, 22 SSH and SFTP, 443 the website, 2222 the hosting panel.
          for port in 21 22 443 2222; do
            if timeout 10 bash -c "exec 3<>/dev/tcp/$FTP_HOST/$port" 2> /dev/null; then
              echo "Port $port answers."
            else
              echo "::warning::Port $port does not answer from this runner."
            fi
          done

      - name: Can the FTP port be reached
        run: |
          if ! timeout 10 bash -c "exec 3<>/dev/tcp/$FTP_HOST/21" 2> /dev/null; then
            echo "::error::Port 21 does not answer from this runner. The host may block addresses outside its country."
            exit 1
          fi

      - name: Log in and list the folders
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install --yes --no-install-recommends lftp > /dev/null
          timeout 120 lftp --env-password -u "$FTP_USERNAME" "$FTP_HOST" <<EOF
          debug 5
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ftp:list-options -a
          cls -1 "$FOLDER_COM"
          cls -1 "$FOLDER_SI"
          bye
          EOF
