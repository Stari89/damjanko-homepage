name: release

# Pushing a tag such as v2.0.2 checks and builds the site and publishes the
# build as a release on GitHub. The web host does not accept uploads from
# GitHub, so a script on the host fetches the newest release every few minutes
# and installs it: v2/scripts/server-deploy.sh. See v2/docs/deployment.md.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # To create the release.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag is the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Builds first, so dist/ is the tested build.
      - run: npm run test:e2e

      - name: Publish the build as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The three files the host's script downloads. Their names are fixed.
          mkdir "$RUNNER_TEMP/release"
          tar --owner=0 --group=0 --create --gzip --file "$RUNNER_TEMP/release/site.tar.gz" --directory dist .
          cd "$RUNNER_TEMP/release"
          sha256sum site.tar.gz > site.tar.gz.sha256
          echo "$GITHUB_REF_NAME" > version.txt
          gh release create "$GITHUB_REF_NAME" site.tar.gz site.tar.gz.sha256 version.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "The built site. The web host fetches it from here and installs it."

      - name: Wait until both domains show the new version
        run: |
          version="${GITHUB_REF_NAME#v}"
          shows() {
            # $1 address, $2 the language the page must be in
            page="$(curl --silent --max-time 30 "$1" || true)"
            grep --quiet --fixed-strings "$version" <<< "$page" &&
              grep --quiet --fixed-strings "<html lang=\"$2\">" <<< "$page"
          }
          # The host looks for a new release every few minutes.
          for attempt in $(seq 1 40); do
            if shows https://damjanko.com/ en && shows https://damjanko.si/ sl; then
              echo "Both domains show $version."
              curl --silent --show-error --fail --max-time 30 --output /dev/null https://damjanko.com/cv-en.pdf
              curl --silent --show-error --fail --max-time 30 --output /dev/null https://damjanko.si/cv-sl.pdf
              exit 0
            fi
            sleep 30
          done
          echo "::error::The release is published, but after 20 minutes the live site does not show $version. Look at ~/.damjanko-deploy/deploy.log on the host."
          exit 1
