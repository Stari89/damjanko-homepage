name: release

# Pushing a tag such as v2.0.1 checks, builds and publishes the site to both
# domains over FTP. The steps by hand are in v2/docs/deployment.md.
on:
  push:
    tags:
      - "v*"

# Two releases never upload at the same time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag is the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but package.json says $version."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Builds first, so dist/ is the tested build.
      - run: npm run test:e2e

      - name: Check that secrets are set
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for name in FTP_HOST FTP_USERNAME LFTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::A repository secret is missing. FTP_HOST, FTP_USERNAME and FTP_PASSWORD are needed."
              exit 1
            fi
          done

      - name: Upload to both domains
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          # lftp reads the password from this variable, so it is never on a command line.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Each domain's folder, as seen after logging in over FTP. A repository
          # variable of the same name replaces the default.
          FOLDER_COM: ${{ vars.FTP_FOLDER_COM || 'domains/damjanko.com/public_html' }}
          FOLDER_SI: ${{ vars.FTP_FOLDER_SI || 'domains/damjanko.si/public_html' }}
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install --yes --no-install-recommends lftp > /dev/null
          for folder in "$FOLDER_COM" "$FOLDER_SI"; do
            echo "Uploading to $folder"
            # The connection is encrypted and the server's certificate is checked.
            # Nothing outside assets/ is ever deleted: other folders live beside the site.
            # Order: the new assets, then the pages that use them, then the old assets go.
            lftp --env-password -u "$FTP_USERNAME" "$FTP_HOST" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ftp:list-options -a
          cd "$folder"
          mirror --reverse --verbose dist/assets assets
          mirror --reverse --verbose --exclude-glob assets/ dist .
          mirror --reverse --verbose --delete dist/assets assets
          bye
          EOF
          done

      - name: Check the live site
        run: |
          version="${GITHUB_REF_NAME#v}"
          check() {
            # $1 address, $2 text the page must contain
            if ! curl --silent --show-error --fail --max-time 30 "$1" | grep --quiet --fixed-strings "$2"; then
              echo "::error::$1 does not contain \"$2\"."
              exit 1
            fi
            echo "ok: $1 contains \"$2\""
          }
          check https://damjanko.com/ "$version"
          check https://damjanko.com/ '<html lang="en">'
          check https://damjanko.si/ "$version"
          check https://damjanko.si/ '<html lang="sl">'
          curl --silent --show-error --fail --max-time 30 --output /dev/null https://damjanko.com/cv-en.pdf
          curl --silent --show-error --fail --max-time 30 --output /dev/null https://damjanko.si/cv-sl.pdf
